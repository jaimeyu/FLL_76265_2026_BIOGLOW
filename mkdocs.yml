site_name: FLL Team #76265 • BIOGLOW
site_description: Official Documentation, Engineering Notebook & Web Tools for FIRST LEGO League Team 76265 BIOGLOW (2026 Season)
site_author: FLL Team #76265
site_url: https://jaimeyu.github.io/FLL_76265_2026_BIOGLOW/
repo_url: https://github.com/jaimeyu/FLL_76265_2026_BIOGLOW
repo_name: jaimeyu/FLL_76265_2026_BIOGLOW
docs_dir: doc
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    # Dark mode default (matching BIOGLOW aesthetic)
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

