      - 💡 Innovation Project Rubric Guide: mentors/plan/innovation_project_rubric_guide.md
      - Crew Resource Management (CRM): mentors/plan/crew_resource_management.md
      - 📋 Workshop Facilitation Checklist: mentors/plan/mentor_workshop_checklist.md
      - 📇 Mentor CRM Cue Card: mentors/plan/mentor_crm_cue_card.md
      - Season Schedule: mentors/plan/schedule.md
